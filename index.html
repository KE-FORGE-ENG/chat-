<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>AI Chat</title>
<style>
  :root{
    --bg:#141414; --panel:#202020; --bubble:#2b2b2b; --line:#333;
    --text:#ececec; --muted:#9a9a9a; --accent:#d97757;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);
       font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;overflow:hidden}
  button,textarea{font:inherit;color:inherit}
  svg{width:22px;height:22px;fill:currentColor;flex:none}

  header{display:flex;align-items:center;justify-content:space-between;
         padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
  header .title{font-weight:600;color:var(--muted)}
  .icon-btn{background:none;border:0;width:42px;height:42px;border-radius:50%;
            display:grid;place-items:center;color:var(--text);cursor:pointer}
  .icon-btn:active{background:var(--panel)}

  #chat{flex:1;overflow-y:auto;padding:8px 16px 20px;scroll-behavior:smooth}
  .col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

  .welcome{margin:18vh auto 0;text-align:center;color:var(--muted)}
  .welcome .star{width:44px;height:44px;color:var(--accent);margin-bottom:10px}
  .welcome h2{margin:0;color:var(--text);font-weight:600;font-size:22px}
  .welcome .hint{margin:8px auto 18px;max-width:30ch;font-size:15px}
  .chips{display:flex;flex-direction:column;gap:8px;align-items:center}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 16px;cursor:pointer;font-size:15px}
  .chip:active{background:var(--bubble)}

  .user{align-self:flex-end;max-width:86%;background:var(--bubble);
        border:1px solid var(--line);border-radius:18px;padding:12px 16px;white-space:pre-wrap;word-wrap:break-word}
  .user img{display:block;max-width:100%;max-height:220px;border-radius:10px;margin-bottom:8px}
  .bot{align-self:stretch;word-wrap:break-word}
  .bot .body > :first-child{margin-top:0}
  .bot .body > :last-child{margin-bottom:0}
  .bot p{margin:0 0 12px}
  .bot h2,.bot h3,.bot h4,.bot h5{margin:18px 0 8px;line-height:1.3}
  .bot ul,.bot ol{margin:0 0 12px;padding-left:22px}
  .bot li{margin:3px 0}
  .bot a{color:var(--accent)}
  .bot code{background:var(--panel);padding:2px 6px;border-radius:6px;font:14px ui-monospace,Menlo,Consolas,monospace}
  .bot pre{background:#0e0e0e;border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;margin:0 0 12px}
  .bot pre code{background:none;padding:0}
  .tablewrap{overflow-x:auto;margin:0 0 12px;border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:15px}
  th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:var(--panel)}
  tr:last-child td{border-bottom:0}
  .tools{display:flex;gap:4px;margin-top:6px;align-items:center}
  .tools .icon-btn{width:36px;height:36px;color:var(--muted)}
  .tools svg{width:18px;height:18px}
  .tag{font-size:13px;color:var(--muted);margin-left:6px}

  .thinking{display:flex;align-items:center;gap:10px;color:var(--muted)}
  .thinking svg{color:var(--accent);animation:spin 1.6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.thinking svg{animation:none}}

  .composer{padding:8px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
  .box{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
       border-radius:26px;padding:12px 12px 10px}
  .preview{display:none;padding:0 4px 8px}
  .preview.on{display:flex;align-items:center;gap:8px}
  .preview img{height:56px;border-radius:8px}
  .preview button{background:var(--bubble);border:0;border-radius:50%;width:24px;height:24px;cursor:pointer}
  textarea{width:100%;background:none;border:0;outline:none;resize:none;max-height:140px;padding:4px 8px}
  textarea::placeholder{color:var(--muted)}
  .row{display:flex;align-items:center;gap:8px;margin-top:6px}
  .row .grow{flex:1}
  .circle{width:42px;height:42px;border-radius:50%;border:0;background:var(--bubble);
          display:grid;place-items:center;cursor:pointer;color:var(--text)}
  .circle.rec{background:#e5553d;color:#fff}
  #send{background:var(--accent);color:#fff}
  #send:disabled{opacity:.45}
  .pill{background:var(--bubble);border:0;border-radius:22px;padding:0 16px;height:42px;cursor:pointer;
        display:flex;align-items:center;gap:6px}
  .pill small{color:var(--muted)}
  #modelLabel{max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:420px){.pill small{display:none}}
  button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* glass toast */
  .toast-wrap{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));width:min(92vw,380px);z-index:50;
    transform:translate(-50%,-150%);opacity:0;pointer-events:none;
    transition:transform .6s cubic-bezier(.2,1.25,.3,1),opacity .35s ease}
  .toast-wrap.on{transform:translate(-50%,0);opacity:1}
  .toast-glow{position:absolute;inset:-14px -8px;filter:blur(28px);opacity:.95;border-radius:40px;
    background:radial-gradient(60% 95% at 14% 25%,rgba(217,119,87,.8),transparent 70%),
               radial-gradient(55% 95% at 92% 85%,rgba(86,140,255,.6),transparent 70%);
    animation:drift 5s ease-in-out infinite alternate;transition:background .6s}
  .toast-wrap[data-state="ok"] .toast-glow{background:radial-gradient(60% 95% at 14% 25%,rgba(80,215,150,.75),transparent 70%),
               radial-gradient(55% 95% at 92% 85%,rgba(86,140,255,.5),transparent 70%)}
  .toast-wrap[data-state="error"] .toast-glow{background:radial-gradient(60% 95% at 14% 25%,rgba(255,95,80,.8),transparent 70%),
               radial-gradient(55% 95% at 92% 85%,rgba(217,119,87,.5),transparent 70%)}
  @keyframes drift{to{transform:translateX(12px) scale(1.07)}}
  .toast{position:relative;display:flex;gap:13px;align-items:flex-start;padding:15px 16px 19px;border-radius:22px;overflow:hidden;
    background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05)),rgba(18,18,18,.42);
    -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
    border:1px solid rgba(255,255,255,.24);
    box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.06)}
  .toast::after{content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.2),transparent);transform:skewX(-18deg);
    animation:sheen 3s ease-in-out infinite}
  @keyframes sheen{0%{left:-60%}60%,100%{left:135%}}
  .t-icon{position:relative;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;
    color:#ffb08a;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22)}
  .t-icon svg{width:22px;height:22px}
  .t-icon svg.swap{animation:spin 1.6s linear infinite}
  .t-icon .ring{position:absolute;inset:-5px;border-radius:17px;border:2px solid currentColor;opacity:0;animation:ring 1.5s ease-out infinite}
  @keyframes ring{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.2);opacity:0}}
  .toast[data-state="ok"] .t-icon{color:#7ee2a8}
  .toast[data-state="ok"] .t-icon svg{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  .toast[data-state="error"] .t-icon{color:#ff8a75}
  @keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
  .t-body{min-width:0;flex:1}
  .t-title{display:block;font-weight:650;font-size:15.5px;line-height:1.25;color:#fff}
  .t-text{display:block;margin-top:3px;font-size:13.5px;line-height:1.4;color:rgba(255,255,255,.8)}
  .hops{display:flex;gap:6px;margin-top:11px}
  .hops:empty{display:none}
  .hop{width:28px;height:6px;border-radius:3px;background:rgba(255,255,255,.25);transition:background .4s}
  .hop.bad{background:#ff8a75}
  .hop.ok{background:#7ee2a8}
  .hop.now{background:linear-gradient(90deg,rgba(255,176,138,.4),#ffb08a,rgba(255,176,138,.4));background-size:200% 100%;animation:shimmer 1s linear infinite}
  @keyframes shimmer{to{background-position:-200% 0}}
  .t-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.1)}
  .t-bar i{display:block;height:100%;width:38%;background:linear-gradient(90deg,transparent,#ffb08a,transparent);animation:slide 1.2s ease-in-out infinite}
  @keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(270%)}}
  @supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
    .toast{background:rgba(32,32,32,.94)}
  }
  .toast[data-state="ok"] .t-bar i{width:100%;background:#7ee2a8;animation:none}
  .toast[data-state="error"] .t-bar i{width:100%;background:#ff8a75;animation:none}
  @media (prefers-reduced-motion:reduce){
    .toast-glow,.toast::after,.t-icon .ring,.t-icon svg,.t-bar i,.hop.now{animation:none!important}
    .toast-wrap{transition:opacity .2s}
  }


  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .sheet-bg.on{display:flex}
  .sheet{background:var(--panel);width:100%;max-width:560px;border-radius:22px 22px 0 0;
         padding:14px 8px;padding-bottom:max(18px,env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto}
  .sheet h3{margin:4px 14px 10px;font-size:15px;color:var(--muted);font-weight:600}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;
       padding:12px 14px;border-radius:14px;cursor:pointer}
  .opt:active,.opt.sel{background:var(--bubble)}
  .opt .t{flex:1}
  .opt .t b{display:block;font-weight:600}
  .opt .t span{color:var(--muted);font-size:14px}
  .opt .ck{color:var(--accent);visibility:hidden}
  .soon{font-style:normal;font-size:11px;font-weight:600;margin-left:6px;padding:2px 8px;border-radius:10px;
        background:rgba(217,119,87,.18);color:#ffb08a;vertical-align:middle}
  .opt.sel .ck{visibility:visible}
</style>
</head>
<body>

<header>
  <button class="icon-btn" id="newChat" aria-label="New chat">
    <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
  </button>
  <div class="title" id="title">New chat</div>
  <span style="width:42px"></span>
</header>

<main id="chat"><div class="col" id="col"></div></main>

<div class="composer">
  <div class="box">
    <div class="preview" id="preview"><img id="prevImg" alt=""><button id="prevX" aria-label="Remove image">✕</button></div>
    <textarea id="input" rows="1" placeholder="Ask anything"></textarea>
    <div class="row">
      <button class="circle" id="attach" aria-label="Attach image">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
      <button class="pill" id="modelBtn" aria-label="Choose model"><span id="modelLabel"></span>
        <small id="modelSub"></small></button>
      <span class="grow"></span>
      <button class="circle" id="mic" aria-label="Speak">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2z"/></svg>
      </button>
      <button class="circle" id="send" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M11 20V8.8l-4.6 4.6L5 12l7-7 7 7-1.4 1.4L13 8.8V20h-2z"/></svg>
      </button>
    </div>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-label="Models">
    <h3>Model</h3>
    <div id="opts"></div>
  </div>
</div>

<script>
/* ================= CONFIG: edit these ================= */
const CONFIG = {
  // Up to 3 endpoints, tried in order. If one hits a rate limit, a low credit
  // balance or a server error, the next one answers automatically.
  ENDPOINTS: [
    { url: "https://brainy-bot-api.lovable.app/api/public/ai" },
    { url: "https://ke-forge-lab.lovable.app/api/public/ai" },
    { url: "https://sparky-ai-gateway.lovable.app/api/public/ai" },
    // Optional extras inside any endpoint:
    //   modelMap: {"2.0": "model-name-on-this-endpoint"}   (if names differ per endpoint)
    //   build(model, messages){ ... }   parse(json){ ... }  (if its format differs)
  ],
  COOLDOWN_LIMIT_SEC: 60,          // skip an endpoint this long after a rate limit
  COOLDOWN_CREDIT_SEC: 1800,       // skip it this long after a low-balance / bad-key error
  FALLBACK_ON_SERVER_ERROR: true,  // also move on after a 5xx error or network failure
  SHOW_SERVER_TAG: false,          // set true to see which endpoint answered (for testing)
};

// id = what the dropdown stores. apiModel = the value sent to your endpoint
// (change apiModel to the real model name your endpoint expects).
const MODELS = [
  {id:"1.0",      name:"1.0",       sub:"GPT-6 Luna",        desc:"Short, simple answers",                        apiModel:"1.0"},
  {id:"1.5",      name:"1.5",       sub:"GPT-6 Astra",       desc:"Friendly and casual",                          apiModel:"1.5"},
  {id:"2.0",      name:"2.0",       sub:"Claude Sonnet 5",   desc:"Detailed, understands images",                 apiModel:"2.0", vision:true},
  {id:"2.5",      name:"2.5",       sub:"Gemini 3.1 Pro",    desc:"Advanced reasoning across text, images, audio",apiModel:"2.5", vision:true},
  {id:"3.0flash", name:"3.0 Flash", sub:"Gemini 3.8 Flash",  desc:"Fast expert answers",                          apiModel:"3.0flash"},
  {id:"3.5pro",   name:"3.5 Pro",   sub:"GPT-6 Sol",         desc:"Deepest reasoning",                            apiModel:"3.5pro"},
  {id:"4.0pro",   name:"4.0 Pro",   sub:"Fable 5",           desc:"Max reasoning",                                apiModel:"4.0pro", vision:true},
];

// Friendly names shown to everyday users, and the model picked on first visit.
const NICKS = {"1.0":"Quick answers","1.5":"Friendly chat","2.0":"Detailed + images","2.5":"Smart reasoning","3.0flash":"Fast expert","3.5pro":"Deep thinking","4.0pro":"Deepest thinking"};
MODELS.forEach(m => m.nick = NICKS[m.id] || m.name);
MODELS.find(m => m.id === '4.0pro').soon = true;   // Fable 5 is not live yet; remove this line when it is
const SOON_MSG = 'Still under development. Developers are working hard on this.';
const DEFAULT_ID = "1.5";

// How the request body looks. Change this if your endpoint wants another shape.
function buildRequest(model, messages, meta){
  meta = meta || {};
  const last = messages[messages.length - 1];
  const parts = Array.isArray(last.content) ? last.content : [{type:'text', text:last.content}];
  const text = (parts.find(x => x.type === 'text') || {}).text || '';
  const img = (parts.find(x => x.type === 'image_url') || {}).image_url?.url;
  let message = text;
  if(meta.needContext && messages.length > 1){      // a server that has not seen this chat yet
    const flat = c => (typeof c === 'string' ? c : ((c.find(x => x.type === 'text') || {}).text || '(image)')).slice(0, 800);
    const prior = messages.slice(0, -1).slice(-12).map(x => (x.role === 'user' ? 'User: ' : 'Assistant: ') + flat(x.content));
    message = 'Earlier in this conversation:\n' + prior.join('\n') + '\n\nNew message from the user: ' + text;
  }
  const body = { task: img ? 'identify-image' : 'chat', message, version: model.apiModel, session_id: meta.sessionId };
  if(img) body.image_url = img;
  return body;
}
// How the answer text is pulled out of the response. Handles common shapes.
function parseReply(j){
  if (typeof j === "string") return j;
  const v = j?.choices?.[0]?.message?.content ?? j?.content?.[0]?.text ?? j?.reply ?? j?.response
         ?? j?.text ?? j?.output ?? j?.result ?? j?.data?.reply ?? j?.data?.response ?? j?.data?.text
         ?? (typeof j?.data === 'string' ? j.data : undefined) ?? j?.message?.content ?? j?.message ?? j?.answer;
  return typeof v === "string" ? v : JSON.stringify(j, null, 2);
}
/* ====================================================== */

const $ = s => document.querySelector(s);
const col = $('#col'), chat = $('#chat'), input = $('#input');
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2l1.6 6.2L19.5 5l-3.2 5.9L22 12l-5.7 1.1L19.5 19l-5.9-3.2L12 22l-1.6-6.2L4.5 19l3.2-5.9L2 12l5.7-1.1L4.5 5l5.9 3.2z"/></svg>';
let model = MODELS.find(m => m.id === localStorage.getItem('model')) || MODELS.find(m => m.id === DEFAULT_ID) || MODELS[0];
let history = [], busy = false, pendingImg = null, ctrl = null;

/* ---------- markdown (small, safe) ---------- */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
const isTableSep = l => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(l || '') && (l||'').includes('-');
const cells = l => l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c => c.trim());
function md(src){
  const blocks = [];
  src = src.replace(/```[\w-]*\n?([\s\S]*?)```/g, (m,c) => { blocks.push('<pre><code>'+esc(c.replace(/\n$/,''))+'</code></pre>'); return '\u0000'+(blocks.length-1)+'\u0000'; });
  const L = src.split('\n'); const out = []; let i = 0, m;
  const special = l => /^\u0000\d+\u0000$/.test(l) || /^#{1,4}\s/.test(l) || /^\s*([-*]|\d+\.)\s+/.test(l) || (/\|/.test(l) && false);
  while(i < L.length){
    const l = L[i];
    if(!l.trim()){ i++; continue; }
    if(m = l.match(/^\u0000(\d+)\u0000$/)){ out.push(blocks[m[1]]); i++; continue; }
    if(m = l.match(/^(#{1,4})\s+(.*)/)){ const n = m[1].length+1; out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue; }
    if(l.includes('|') && isTableSep(L[i+1])){
      const head = cells(l); i += 2; const rows = [];
      while(i < L.length && L[i].includes('|') && L[i].trim()){ rows.push(cells(L[i])); i++; }
      out.push('<div class="tablewrap"><table><thead><tr>'+head.map(c=>`<th>${inline(c)}</th>`).join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>');
      continue;
    }
    if(/^\s*[-*]\s+/.test(l)){
      const it = []; while(i < L.length && /^\s*[-*]\s+/.test(L[i])){ it.push(L[i].replace(/^\s*[-*]\s+/,'')); i++; }
      out.push('<ul>'+it.map(x=>`<li>${inline(x)}</li>`).join('')+'</ul>'); continue;
    }
    if(/^\s*\d+\.\s+/.test(l)){
      const it = []; while(i < L.length && /^\s*\d+\.\s+/.test(L[i])){ it.push(L[i].replace(/^\s*\d+\.\s+/,'')); i++; }
      out.push('<ol>'+it.map(x=>`<li>${inline(x)}</li>`).join('')+'</ol>'); continue;
    }
    const p = [];
    while(i < L.length && L[i].trim() && !special(L[i]) && !(L[i].includes('|') && isTableSep(L[i+1]))){ p.push(L[i]); i++; }
    out.push('<p>'+p.map(inline).join('<br>')+'</p>');
  }
  return out.join('');
}

/* ---------- UI helpers ---------- */
const SUGGESTIONS = ["Explain photosynthesis simply", "Help me write a message", "Make a study timetable", "Tell me a fun fact"];
function showWelcome(){
  col.innerHTML = `<div class="welcome">${STAR}<h2>How can I help?</h2>
    <p class="hint">Type, or tap the mic to speak. Tap + to add a photo.</p>
    <div class="chips">${SUGGESTIONS.map(x => `<button class="chip">${esc(x)}</button>`).join('')}</div></div>`;
  col.querySelectorAll('.chip').forEach(b => b.onclick = () => { input.value = b.textContent; send(); });
}
function scrollDown(){ chat.scrollTop = chat.scrollHeight; }
function addUser(text, img){
  const w = col.querySelector('.welcome'); if(w) w.remove();
  const d = document.createElement('div'); d.className = 'user';
  if(img){ const im = document.createElement('img'); im.src = img; d.appendChild(im); }
  d.appendChild(document.createTextNode(text)); col.appendChild(d); scrollDown();
}
function addBot(){
  const d = document.createElement('div'); d.className = 'bot';
  d.innerHTML = `<div class="body"><div class="thinking">${STAR}<span>Thinking…</span></div></div>`;
  col.appendChild(d); scrollDown(); return d;
}
function finishBot(d, text, modelUsed, idx){
  d.querySelector('.body').innerHTML = md(text);
  const t = document.createElement('div'); t.className = 'tools';
  t.innerHTML =
    `<button class="icon-btn" data-a="copy" aria-label="Copy"><svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg></button>`+
    `<button class="icon-btn" data-a="speak" aria-label="Read aloud"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>`+
    `<span class="tag">${esc(modelUsed.nick)} (${esc(modelUsed.name)})${CONFIG.SHOW_SERVER_TAG && idx != null ? ' · server ' + (idx + 1) : ''}</span>`;
  t.onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.a === 'copy') navigator.clipboard?.writeText(text);
    if(b.dataset.a === 'speak') speak(text);
  };
  d.appendChild(t); scrollDown();
}

/* ---------- glass toast ---------- */
const Toast = (() => {
  const ICON = {
    wallet:"M21 7H5a1 1 0 0 1 0-2h14V3H5a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1zm-3 8a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z",
    swap:"M12 4V1L8 5l4 4V6a6 6 0 0 1 6 6c0 1-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14a6 6 0 0 1-6-6c0-1 .25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z",
    check:"M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z",
    warn:"M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"
  };
  let wrap = null, timer = null;
  function init(){
    if(wrap) return;
    wrap = document.createElement('div');
    wrap.className = 'toast-wrap';
    wrap.setAttribute('role', 'status'); wrap.setAttribute('aria-live', 'polite');
    wrap.innerHTML = '<div class="toast-glow"></div><div class="toast" data-state="loading">' +
      '<div class="t-icon"></div><div class="t-body"><b class="t-title"></b><span class="t-text"></span><div class="hops"></div></div>' +
      '<div class="t-bar"><i></i></div></div>';
    document.body.appendChild(wrap);
  }
  function show(o){
    init(); clearTimeout(timer);
    const state = o.state || 'loading', icon = o.icon || 'swap';
    wrap.dataset.state = state;
    wrap.querySelector('.toast').dataset.state = state;
    wrap.querySelector('.t-icon').innerHTML = '<span class="ring"></span><svg viewBox="0 0 24 24" class="' + icon + '" fill="currentColor"><path d="' + ICON[icon] + '"/></svg>';
    wrap.querySelector('.t-title').textContent = o.title || '';
    wrap.querySelector('.t-text').textContent = o.text || '';
    wrap.querySelector('.hops').innerHTML = (o.hops || []).map(h => '<span class="hop ' + h + '"></span>').join('');
    requestAnimationFrame(() => wrap.classList.add('on'));
    if(o.hide) timer = setTimeout(hide, o.hide);
  }
  function hide(){ clearTimeout(timer); if(wrap) wrap.classList.remove('on'); }
  return {show, hide};
})();

/* ---------- endpoints with automatic fallback ---------- */
const cool = {};  // endpoint index -> time (ms) until which it is skipped
const newSession = () => 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
let sessionId = newSession();
const seen = new Set();  // 'session|endpoint' pairs that already know this chat
const WAIT = 'Please wait while we switch to a backup server…';
const SWITCH_MSG = {
  credit: ['Credit finished', 'Your credit has finished. ' + WAIT],
  limit:  ['Server is busy', 'Too many requests right now. ' + WAIT],
  auth:   ['Server unavailable', WAIT],
  server: ['Server unavailable', WAIT],
  network:['Server unavailable', WAIT]
};
const RE_CREDIT = /credit|balance|insufficient|billing|payment|funds|top.?up|afford/i;
const RE_LIMIT  = /rate.?limit|too many requests|quota|throttl|exceeded|overloaded|try again (later|in)/i;

function errText(j, raw, status){
  const e = (j && typeof j === 'object') ? (j.error?.message || j.error || j.message || j.detail) : null;
  if(e) return typeof e === 'string' ? e : JSON.stringify(e);
  return typeof raw === 'string' && raw ? raw.slice(0, 300) : ('HTTP ' + status);
}
// Returns null when the reply is fine, otherwise {kind, msg, fall}
function classify(status, j, raw){
  const hasErr = status >= 400 || (j && typeof j === 'object' && ((j.error && !j.choices) || j.success === false));
  if(!hasErr) return null;
  const msg = errText(j, raw, status);
  if(status === 402 || RE_CREDIT.test(msg)) return {kind:'credit', msg, fall:true};
  if(status === 429 || RE_LIMIT.test(msg))  return {kind:'limit',  msg, fall:true};
  if(status === 401 || status === 403 || status === 408) return {kind:'auth', msg, fall:true};
  if(status >= 500) return {kind:'server', msg, fall:CONFIG.FALLBACK_ON_SERVER_ERROR};
  return {kind:'other', msg, fall:false};
}
async function askEndpoints(eps, model, messages, signal){
  const now = Date.now();
  let order = eps.map((e, i) => i).filter(i => (cool[i] || 0) <= now);
  if(!order.length) order = eps.map((e, i) => i);   // all cooling down: try them anyway
  let lastErr = null;
  const failed = new Set();
  for(const i of order){
    const ep = eps[i];
    const headers = {'Content-Type':'application/json'};
    if(ep.key) headers[ep.header || 'Authorization'] = (ep.prefix ?? 'Bearer ') + ep.key;
    const m = Object.assign({}, model, {apiModel: ep.modelMap?.[model.id] || model.apiModel});
    let r = null, j, fail;
    try{
      r = await fetch(ep.url, {method:'POST', headers, body: JSON.stringify((ep.build || buildRequest)(m, messages, {sessionId, needContext: messages.length > 1 && !seen.has(sessionId + '|' + i)})), signal});
      const raw = await r.text();
      try{ j = JSON.parse(raw); }catch{ j = raw; }
      fail = classify(r.status, j, raw);
    }catch(e){
      if(e.name === 'AbortError'){ Toast.hide(); throw e; }
      fail = {kind:'network', msg:e.message, fall:CONFIG.FALLBACK_ON_SERVER_ERROR};
    }
    if(!fail){
      const reply = (ep.parse || parseReply)(j);
      seen.add(sessionId + '|' + i);
      if(failed.size) Toast.show({state:'ok', icon:'check', title:'Back online', text:'Connected to a backup server. Writing your answer…',
        hops: eps.map((_, k) => failed.has(k) ? 'bad' : (k === i ? 'ok' : '')), hide:2800});
      return {reply, idx: i};
    }

    lastErr = new Error(fail.msg);
    console.warn('Endpoint ' + (i + 1) + ' failed (' + fail.kind + '): ' + fail.msg);
    if(!fail.fall){ Toast.hide(); throw lastErr; }
    let secs = fail.kind === 'limit' ? CONFIG.COOLDOWN_LIMIT_SEC
             : (fail.kind === 'credit' || fail.kind === 'auth') ? CONFIG.COOLDOWN_CREDIT_SEC : 30;
    const ra = r ? parseInt(r.headers.get('retry-after')) : NaN;
    if(fail.kind === 'limit' && ra > 0) secs = Math.min(ra, 3600);
    cool[i] = Date.now() + secs * 1000;
    failed.add(i);
    const next = order[order.indexOf(i) + 1];
    if(next !== undefined){
      const M = SWITCH_MSG[fail.kind] || SWITCH_MSG.server;
      Toast.show({state:'loading', icon: fail.kind === 'credit' ? 'wallet' : 'swap', title:M[0], text:M[1],
        hops: eps.map((_, k) => failed.has(k) ? 'bad' : (k === next ? 'now' : ''))});
    }
  }
  Toast.show({state:'error', icon:'warn', title:'All servers are busy', text:'Please try again in a minute.',
    hops: eps.map(() => 'bad'), hide:5500});
  throw new Error('All servers are busy right now. Please try again in a minute.');
}

/* ---------- sending ---------- */
async function send(){
  const text = input.value.trim();
  if(busy){ ctrl?.abort(); return; }
  if(!text && !pendingImg) return;
  if(model.soon){                                   // not available yet: answer without calling any endpoint
    addUser(text || '(image)', pendingImg);
    input.value = ''; autosize(); clearImg();
    const b = addBot(); const mm = model;
    setTimeout(() => finishBot(b, SOON_MSG, mm), 600);
    return;
  }
  const eps = CONFIG.ENDPOINTS.filter(e => e && e.url && !e.url.startsWith('PASTE_')).slice(0, 3);
  if(!eps.length){ alert('Set at least one endpoint in CONFIG.ENDPOINTS at the top of the file first.'); return; }

  const img = pendingImg, used = model;
  addUser(text || '(image)', img);
  if(history.length === 0) $('#title').textContent = (text || 'Image').slice(0, 28);

  const content = img ? [{type:'text', text: text || 'Describe this image.'}, {type:'image_url', image_url:{url: img}}] : text;
  history.push({role:'user', content});
  input.value = ''; autosize(); clearImg(); setBusy(true);
  const bot = addBot();

  ctrl = new AbortController();
  try{
    const {reply, idx} = await askEndpoints(eps, used, history, ctrl.signal);
    history.push({role:'assistant', content: reply});
    finishBot(bot, reply, used, idx);
  }catch(e){
    history.pop();
    bot.querySelector('.body').innerHTML = e.name === 'AbortError'
      ? '<p style="color:var(--muted)">Stopped.</p>'
      : '<p style="color:#ff8a75">Request failed: ' + esc(e.message) + '</p>';
  }
  setBusy(false);
}
function setBusy(b){
  busy = b;
  $('#send').innerHTML = b
    ? '<svg viewBox="0 0 24 24"><path d="M7 7h10v10H7z"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M11 20V8.8l-4.6 4.6L5 12l7-7 7 7-1.4 1.4L13 8.8V20h-2z"/></svg>';
}

/* ---------- model picker ---------- */
function renderModel(){
  $('#modelLabel').textContent = model.nick; $('#modelSub').textContent = model.name;
  $('#opts').innerHTML = MODELS.map(m =>
    `<button class="opt ${m.id===model.id?'sel':''}" data-id="${m.id}">
       <div class="t"><b>${esc(m.nick)}${m.soon ? ' <em class="soon">Soon</em>' : ''}</b><span>${esc(m.desc)} (${esc(m.name)} · ${esc(m.sub)})</span></div>
       <svg class="ck" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
     </button>`).join('');
}
$('#modelBtn').onclick = () => $('#sheetBg').classList.add('on');
$('#sheetBg').onclick = e => {
  if(e.target.id === 'sheetBg') return $('#sheetBg').classList.remove('on');
  const b = e.target.closest('.opt'); if(!b) return;
  model = MODELS.find(m => m.id === b.dataset.id); localStorage.setItem('model', model.id);
  renderModel(); $('#sheetBg').classList.remove('on');
};

/* ---------- image attach ---------- */
$('#attach').onclick = () => $('#file').click();
$('#file').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => { // shrink to keep the request small
      const s = Math.min(1, 1280 / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = im.width*s; c.height = im.height*s;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      pendingImg = c.toDataURL('image/jpeg', .85); $('#prevImg').src = pendingImg; $('#preview').classList.add('on');
      if(!model.vision) alert('"' + model.nick + '" may not read photos. Choose Detailed + images, Smart reasoning or Deepest thinking.');
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(f); e.target.value = '';
};
function clearImg(){ pendingImg = null; $('#preview').classList.remove('on'); }
$('#prevX').onclick = clearImg;

/* ---------- voice (uses the browser's built-in engines) ---------- */
function speak(t){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(t.replace(/```[\s\S]*?```/g,' code block ').replace(/[*_`#>|~]/g,'')));
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let recog = null;
$('#mic').onclick = () => {
  if(!SR){ alert('Speech input is not supported in this browser. Try Chrome.'); return; }
  if(recog){ recog.stop(); return; }
  recog = new SR(); recog.lang = navigator.language || 'en-US'; recog.interimResults = true;
  $('#mic').classList.add('rec');
  recog.onresult = e => { input.value = [...e.results].map(r => r[0].transcript).join(''); autosize(); };
  recog.onend = () => { recog = null; $('#mic').classList.remove('rec'); };
  recog.onerror = () => {};
  recog.start();
};

/* ---------- wiring ---------- */
function autosize(){ input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; }
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches){ e.preventDefault(); send(); }
});
$('#send').onclick = send;
$('#newChat').onclick = () => { ctrl?.abort(); speechSynthesis?.cancel(); history = []; sessionId = newSession(); seen.clear(); $('#title').textContent = 'New chat'; showWelcome(); };
renderModel(); showWelcome();
</script>
